<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>RachelRachelRachel</title>
</head>
<body>
	<div id="navbar">
		<h1>Navigation Bar</h1>
		<button id="changeColorBtn">Change Header Color</button>
	</div>
	<div id="main-content" class="bucket bolded">
		<div class="sidebar">
			<h3>Side Bar Navigation</h3>
		</div>
		<div class="content">
			<h3>Main Content</h3>
		</div>
	</div>

</body>
<script>
document
    .getElementById("changeColorBtn")
    .addEventListener("click", function() {
    	console.log("Hello World")
        document
            .querySelector("#navbar h1")
            .style
            .color = "green";
            
        document
            .querySelector(".content")
            .innerHTML = "<p>New content added!</p>";
});
</script>
</html>
